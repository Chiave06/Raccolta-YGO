name: Aggiorna elenchi carte

on:
  schedule:
    - cron: "17 5 * * 1"   # ogni lunedì mattina
  workflow_dispatch:        # oppure a mano dalla scheda Actions

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Yu-Gi-Oh! ---
      - name: Yu-Gi-Oh! - scarica e genera cards.json
        continue-on-error: true
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/DawnbrandBots/yaml-yugi "$RUNNER_TEMP/yaml-yugi"
          D=$(git -C "$RUNNER_TEMP/yaml-yugi" log -1 --format=%cd --date=short)
          python3 tools/make_db.py "$RUNNER_TEMP/yaml-yugi/data/cards" cards.json "$D"
          echo "DATA_YGO=$D" >> "$GITHUB_ENV"

      # --- Pokémon ---
      - name: Pokémon - scarica e genera pokemon.json
        continue-on-error: true
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/PokemonTCG/pokemon-tcg-data "$RUNNER_TEMP/pkm"
          D=$(git -C "$RUNNER_TEMP/pkm" log -1 --format=%cd --date=short)
          python3 tools/make_pkm_db.py "$RUNNER_TEMP/pkm" pokemon.json "$D"

      # --- Magic (dati Scryfall, file "Default Cards") ---
      - name: Magic - scarica e genera magic.json
        continue-on-error: true
        run: |
          H1='User-Agent: raccolta-tcg/1.0'
          H2='Accept: application/json'
          curl -fsS -H "$H1" -H "$H2" -o "$RUNNER_TEMP/bulk.json" https://api.scryfall.com/bulk-data
          python3 - "$RUNNER_TEMP/bulk.json" > "$RUNNER_TEMP/bulk.env" <<'PY'
          import sys, json
          data = json.load(open(sys.argv[1]))
          items = data.get("data", []) if isinstance(data, dict) else data
          sel = [x for x in items if "default" in str(x.get("type", "")) and "card" in str(x.get("type", ""))]
          if not sel:
              sys.stderr.write("Nessun elemento default cards. Tipi trovati: %s\n" % [x.get("type") for x in items])
              sys.exit(1)
          x = sel[0]
          sys.stderr.write("Elemento trovato (chiavi): %s\n" % sorted(x.keys()))
          url = next((v for k, v in x.items() if isinstance(v, str) and v.startswith("http") and "download" in k), None) or next((v for k, v in x.items() if isinstance(v, str) and v.startswith("http") and v.endswith((".json", ".jsonl", ".gz"))), None)
          if not url:
              sys.stderr.write("Nessun indirizzo di download nell'elemento: %s\n" % json.dumps(x)[:600])
              sys.exit(1)
          day = str(x.get("updated_at") or x.get("updated") or "")[:10] or "0000-00-00"
          print("URL=" + url)
          print("D=" + day)
          PY
          . "$RUNNER_TEMP/bulk.env"
          echo "Scarico $URL"
          curl -fsS -H "$H1" -H "$H2" -o "$RUNNER_TEMP/scryfall.dl" "$URL"
          python3 - "$RUNNER_TEMP/scryfall.dl" "$RUNNER_TEMP/scryfall.json" <<'PY'
          import sys, json, gzip
          src, dst = sys.argv[1], sys.argv[2]
          raw = open(src, "rb").read(2)
          op = gzip.open if raw == b"\x1f\x8b" else open
          keep = ("id", "name", "set", "set_name", "collector_number", "rarity", "lang", "layout", "digital")
          out = []
          with op(src, "rt", encoding="utf8") as f:
              head = f.read(1)
              f.seek(0)
              if head == "[":
                  items = json.load(f)
              else:
                  items = (json.loads(l) for l in f if l.strip())
              for c in items:
                  out.append({k: c.get(k) for k in keep})
          json.dump(out, open(dst, "w", encoding="utf8"))
          print("Carte lette:", len(out))
          PY
          python3 tools/make_mtg_db.py "$RUNNER_TEMP/scryfall.json" magic.json "$D"

      - name: Salva solo se ci sono novità
        run: |
          for f in cards.json pokemon.json magic.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Aggiorna elenchi carte ($(date +%F))"
            git push
          fi
